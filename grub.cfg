# Master GRUB Configuration for gNewSense Evolution v5.0 / v5.0.1
# ===============================================================

set timeout=10
set default=0

# Style Settings
set menu_color_normal=white/black
set menu_color_highlight=black/light-blue

# --- STANDARD LIVE PRODUCTION ENTRIES ---

menuentry "🚀 gNewSense Evolution Live (64-Bit Performance - Linux Zen)" {
    linux /boot/vmlinuz-zen boot=live quiet splash preempt=full
    initrd /boot/initrd-zen.img
}

menuentry "🌟 gNewSense Evolution Live (64-Bit Modern - amd64 Standard)" {
    linux /boot/vmlinuz-amd64 boot=live quiet splash
    initrd /boot/initrd-amd64.img
}

menuentry "💾 gNewSense Evolution Live (32-Bit Legacy - i686 Standard)" {
    linux /boot/vmlinuz-i686 boot=live quiet splash forcepae
    initrd /boot/initrd-i686.img
}

# --- SYSTEM RECOVERY & DIAGNOSTIC ENTRIES ---

submenu "🛠️ System Advanced Recovery Options..." {
    set menu_color_normal=white/black
    set menu_color_highlight=black/light-blue

    menuentry "⚠️ Recovery Mode (Linux Zen - Maintenance Console)" {
        linux /boot/vmlinuz-zen boot=live xorg-configure single nomodeset vga=normal
        initrd /boot/initrd-zen.img
    }

    menuentry "⚠️ Recovery Mode (amd64 Standard - Maintenance Console)" {
        linux /boot/vmlinuz-amd64 boot=live xorg-configure single nomodeset vga=normal
        initrd /boot/initrd-amd64.img
    }

    menuentry "⚠️ Recovery Mode (i686 Legacy - Maintenance Console)" {
        linux /boot/vmlinuz-i686 boot=live xorg-configure single nomodeset vga=normal forcepae
        initrd /boot/initrd-i686.img
    }
}

menuentry "🧮 Run System Memory Test (Memtest86+ Diagnostic)" {
    linux /boot/memtest86+.bin
}

menuentry "🔌 Reboot System" {
    reboot
}

menuentry "📴 Shut Down System" {
    halt
}
