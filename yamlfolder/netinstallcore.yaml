# config/includes.chroot/usr/local/share/netinstall-core.yaml
---
- name: "Bootloader Selection"
  description: "Select your preferred master system bootloader framework"
  critical: true
  hidden: false
  selected: true
  subgroups:
    - name: "GRUB 2 (Default)"
      packages: [custom.bootloader.grub]
    - name: "Systemd-boot"
      packages: [custom.bootloader.systemd-boot]
    - name: "Limine"
      packages: [custom.bootloader.limine]
    - name: "Syslinux"
      packages: [custom.bootloader.syslinux]
    - name: "rEFInd"
      packages: [custom.bootloader.refind]
    - name: "No Bootloader"
      packages: [custom.bootloader.none]

- name: "Kernel Selection"
  description: "Choose your preferred system kernel framework"
  critical: true
  hidden: false
  selected: true
  subgroups:
    - name: "Linux Libre Stable"
      packages: [linux-image-libre, linux-headers-libre]
    - name: "Linux Libre LTS"
      packages: [linux-image-libre-lts, linux-headers-libre-lts]
    - name: "Debian Default Kernel"
      packages: [linux-image-amd64, linux-headers-amd64]

- name: "Desktop Environments"
  description: "Full desktops, window managers, or Headless layouts"
  critical: false
  hidden: false
  selected: false
  subgroups:
    - name: "No Desktop (Server Base / Console Only)"
      packages: [tmux, htop, curl, openssh-server]
    - name: "GNOME"
      packages: [task-gnome-desktop]
    - name: "KDE Plasma"
      packages: [task-kde-desktop]
    - name: "Xfce"
      packages: [task-xfce-desktop, xfce4-goodies]
    - name: "Cinnamon"
      packages: [task-cinnamon-desktop]
